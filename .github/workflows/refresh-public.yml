name: Verify public demo metadata
on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-public.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patchwork-editor-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify unchanged source and current version metadata
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,pathlib,subprocess,sys,zipfile
          sys.path.insert(0,'tools')
          from demo_package import api,check_text,audit
          repo='tomlemur57-ux/PATCHWORK-Game'
          assert __import__('os').environ['GH_REPO']==repo
          def tree(commit):
              data=api('/git/trees/'+commit+'?recursive=1')
              assert not data['truncated']
              return {r['path']:r for r in data['tree'] if r['type']=='blob'}
          def source(files):return {p:(r['mode'],r['sha']) for p,r in files.items() if p.startswith('source/')}
          main=api('/git/ref/heads/main')['object']['sha']
          current=api('/git/ref/tags/v0.2.0')['object']['sha']
          newfiles=tree(main)
          assert source(newfiles)==source(tree(current)),'Game source differs; version metadata left unchanged.'
          audit(pathlib.Path.cwd())
          if current!=main:
              api('/git/refs/tags/v0.2.0','PATCH',{'sha':main,'force':False})
              api('/releases/416693554','PATCH',{'target_commitish':main})
          results=[]
          for rid in (415284121,416693554):
              release=api('/releases/'+str(rid))
              check_text(release['name']+'\n'+release['body'],'release description')
              ref=api('/git/ref/tags/'+release['tag_name'])['object']['sha']
              files=tree(ref)
              for name,row in files.items():
                  if pathlib.Path(name).suffix.lower() in ('.txt','.md','.c','.h','.py','.yml','.yaml','.json'):
                      data=base64.b64decode(api('/git/blobs/'+row['sha'])['content'])
                      check_text(data.decode('utf-8'),name)
              asset=next(x for x in release['assets'] if x['name']=='PATCHWORK-Windows.zip')
              raw=subprocess.check_output(['gh','api','repos/'+repo+'/releases/assets/'+str(asset['id']),'-H','Accept: application/octet-stream'])
              assert hashlib.sha256(raw).hexdigest()==asset['digest'].split(':',1)[1]
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.read('demo_link.txt').decode().strip()==release['html_url']
                  for name in z.namelist():
                      if pathlib.Path(name).suffix.lower() in ('.txt','.md','.json'):check_text(z.read(name).decode('utf-8'),name)
                  executable=hashlib.sha256(z.read('PATCHWORK.exe')).hexdigest()
              results.append({'version':release['tag_name'],'sourceFiles':len(source(files)),'zipUnchanged':True,'executableSha256':executable})
          print(json.dumps({'publicVersionsVerified':results},indent=2))
          PY
