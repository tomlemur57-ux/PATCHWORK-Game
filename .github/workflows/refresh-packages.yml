name: Refresh demo packages
on:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-packages.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: patchwork-demo-publication
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Finish versioned demo links
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,subprocess,time,urllib.request,zipfile
          R='tomlemur57-ux/PATCHWORK-Game';B='repos/'+R
          assert __import__('os').environ['GH_REPO']==R
          def api(route,method='GET',body=None,optional=False):
              a=['gh','api',route,'--method',method,'-H','Cache-Control: no-cache']
              if body is not None:a+=['--input','-']
              p=subprocess.run(a,input=None if body is None else json.dumps(body).encode(),capture_output=True)
              if p.returncode:
                  if optional and b'HTTP 404' in p.stderr:return None
                  raise RuntimeError(p.stderr.decode(errors='replace')[-1200:])
              return json.loads(p.stdout or b'null')
          rid=416693554;tag='v0.2.0';release=api(B+'/releases/'+str(rid));old=release['tag_name']
          built='d1ca4646b1166782d807e876415238ef63c0a940'
          main=api(B+'/git/ref/heads/main')['object']['sha']
          def source_tree(commit):
              tree=api(B+'/git/commits/'+commit)['tree']['sha']
              data=api(B+'/git/trees/'+tree+'?recursive=1');assert not data['truncated']
              return {e['path']:(e['mode'],e['sha']) for e in data['tree'] if e['type']!='tree' and (e['path'].startswith('source/') or e['path']=='tools/build_portable.py')}
          assert source_tree(main)==source_tree(built),'Game source changed; do not retag a different build.'
          if old!=tag:
              assert api(B+'/releases/tags/'+tag,optional=True) is None,'Version already used by a different release.'
              existing=api(B+'/git/ref/tags/'+tag,optional=True)
              if existing:
                  assert existing['object']['type']=='commit' and source_tree(existing['object']['sha'])==source_tree(built)
              release=api(B+'/releases/'+str(rid),'PATCH',{'tag_name':tag,'target_commitish':main,'name':'PATCHWORK v0.2.0 - Windows demo'})
          assert release['tag_name']==tag
          url='https://github.com/'+R+'/releases/tag/'+tag
          asset=next(a for a in api(B+'/releases/'+str(rid)+'/assets') if a['name']=='PATCHWORK-Windows.zip')
          download='https://github.com/'+R+'/releases/download/'+tag+'/PATCHWORK-Windows.zip'
          for attempt in range(10):
              try:
                  with urllib.request.urlopen(download,timeout=30) as response:data=response.read(32*1024*1024+1)
                  assert hashlib.sha256(data).hexdigest()==asset['digest'].split(':',1)[1]
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      assert z.read('demo_link.txt').decode().strip()==url
                      assert z.read('PATCHWORK.exe')[:2]==b'MZ'
                  break
              except Exception:
                  if attempt==9:raise
                  time.sleep(3)
          route=B+'/contents/demo_link.txt';wanted=(url+'\n').encode()
          for attempt in range(5):
              current=api(route+'?ref=main')
              if base64.b64decode(current['content'])==wanted:break
              try:api(route,'PUT',{'message':'Update current demo URL [skip ci]','branch':'main','sha':current['sha'],'content':base64.b64encode(wanted).decode()})
              except RuntimeError:
                  if attempt==4:raise
              time.sleep(2)
          assert base64.b64decode(api(route+'?ref=main')['content'])==wanted
          if old!=tag:
              ref=api(B+'/git/ref/tags/'+old,optional=True)
              if ref is not None:
                  assert ref['object']['type']=='commit' and ref['object']['sha']==built,'Unexpected previous version target.'
                  api(B+'/git/refs/tags/'+old,'DELETE')
          print('Public version and ZIP verified: '+url)
          PY
