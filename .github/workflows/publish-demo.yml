name: PATCHWORK editor build
run-name: PATCHWORK ${{ inputs.operation || 'preview' }} ${{ inputs.request_id || 'repository-check' }}
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-demo.yml, tools/demo_package.py]
  workflow_dispatch:
    inputs:
      operation:
        description: Build action
        type: choice
        options: [preview, demo]
        default: preview
        required: true
      source_sha:
        description: Exact saved source commit
        required: false
      request_id:
        description: Request identifier
        required: true
      version:
        description: Demo version
        required: true
permissions:
  contents: read
concurrency:
  group: patchwork-editor-publication
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      OPERATION: ${{ inputs.operation || 'preview' }}
      REQUEST_ID: ${{ inputs.request_id || 'repository-check' }}
      DEMO_VERSION: ${{ inputs.version || 'v0.0.0' }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Validate build request
        run: |
          python3 - <<'PY'
          import os,re
          assert os.environ['GH_REPO']=='tomlemur57-ux/PATCHWORK-Game'
          assert os.environ['OPERATION'] in ('preview','demo')
          assert re.fullmatch(r'[a-zA-Z0-9-]{1,64}',os.environ['REQUEST_ID'])
          assert re.fullmatch(r'(?:v[0-9]+\.[0-9]+\.[0-9]+|demo-[0-9]{8}-[0-9]{6}-[a-f0-9]{6})',os.environ['DEMO_VERSION'])
          assert not os.environ['SOURCE_SHA'] or re.fullmatch(r'[a-f0-9]{40}',os.environ['SOURCE_SHA'])
          PY
      - name: Check public copy
        run: python3 tools/demo_package.py --audit
      - name: Prepare compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build the exact saved source
        run: |
          python3 tools/build_portable.py
          if [ -f tools/test_core.py ]; then python3 tools/test_core.py; fi
      - name: Package and verify
        run: python3 tools/demo_package.py --operation "$OPERATION" --version "$DEMO_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: PATCHWORK-Demo
          path: dist/*
          if-no-files-found: error
          retention-days: 7
