name: Check portable Windows build
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-local-build.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the portable compiler archive
        shell: pwsh
        run: |
          $url='https://ziglang.org/download/0.14.1/zig-x86_64-windows-0.14.1.zip'
          $zip=Join-Path $env:RUNNER_TEMP 'zig.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '554f5378228923ffd558eac35e21af020c73789d87afeabf4bfd16f2e6feed2c') {throw 'Compiler checksum mismatch'}
          Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'compiler')
      - name: Compile current saved game without an SDK or local installer
        shell: pwsh
        run: |
          $zig=Join-Path $env:RUNNER_TEMP 'compiler/zig-x86_64-windows-0.14.1/zig.exe'
          $files=@(Get-ChildItem source -Filter *.c | Sort-Object Name | ForEach-Object FullName)
          $args=@('cc','-target','x86_64-windows-gnu','-std=c99','-O2','-ffreestanding','-fno-stack-protector','-mno-stack-arg-probe','-Wall','-Wextra','-Werror','-Wno-unused-function','-nostdlib')+$files+@('-lkernel32','-luser32','-lgdi32','-lwinmm','-lcomdlg32','-lmsvcrt','-Wl,--entry=mainCRTStartup','-Wl,--subsystem,windows','-Wl,--stack,8388608','-Wl,--dynamicbase','-Wl,--nxcompat','-o','PATCHWORK.exe')
          & $zig @args
          if ($LASTEXITCODE -ne 0) {throw 'Portable build failed'}
          Get-FileHash PATCHWORK.exe -Algorithm SHA256
      - name: Inspect executable format
        shell: python
        run: |
          import pathlib,struct
          b=pathlib.Path('PATCHWORK.exe').read_bytes()
          assert b[:2]==b'MZ'
          p=struct.unpack_from('<I',b,60)[0]
          assert b[p:p+4]==b'PE\0\0' and struct.unpack_from('<H',b,p+4)[0]==0x8664
          print('Windows x64 executable verified. No gameplay test claimed.')
